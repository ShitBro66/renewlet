name: Website Pages

# 项目介绍站仅手动发布，不随 Renewlet 应用更新自动部署。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build website
        env:
          RENEWLET_WEBSITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
          RENEWLET_WEBSITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          RENEWLET_WEBSITE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          RENEWLET_WEBSITE_ANALYTICS_SCRIPT: ${{ vars.RENEWLET_WEBSITE_ANALYTICS_SCRIPT }}
        run: pnpm --filter @renewlet/website build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
